name: 功能建议
description: 描述具体使用场景和期望结果
title: "[Feature] "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        新功能会按照重构路线图评估优先级。请先描述问题和使用场景，不必预设实现方式。
  - type: textarea
    id: problem
    attributes:
      label: 使用场景
      description: 目前遇到了什么问题，谁会在什么情况下需要这项能力？
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: 期望结果
      description: 请描述完成任务时应看到的行为。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 当前替代方案
      description: 目前如何绕过这个问题？此项可以留空。
  - type: textarea
    id: additional
    attributes:
      label: 补充信息
      description: 可提供界面截图、相关标准或兼容性要求，请勿包含敏感信息。
  - type: checkboxes
    id: checklist
    attributes:
      label: 提交确认
      options:
        - label: 我已搜索现有 Issue，没有找到相同建议。
          required: true
