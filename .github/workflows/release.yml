name: Publish GitHub Release

on:
  release:
    types: [published]

concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    name: 验证已发布 Release
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.release-metadata.outputs.version }}

    steps:
      - name: 检出 Release 对应标签
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0

      - name: 校验 Release 标签
        id: release-metadata
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z._-]+)?$ ]]; then
            echo "Release 标签必须使用 vX.Y.Z 或 vX.Y.Z-suffix 格式：$RELEASE_TAG" >&2
            exit 1
          fi
          test "$GITHUB_REF" = "refs/tags/$RELEASE_TAG"
          echo "version=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"

      - name: 安装 Go
        uses: actions/setup-go@v5
        with:
          go-version-file: .go-version
          cache-dependency-path: gofi-backend/go.sum

      - name: 安装 pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: gofi-frontend/package.json

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: gofi-frontend/pnpm-lock.yaml

      - name: 安装依赖
        run: make install

      - name: 运行发布前完整检查
        run: make check

  release-packages:
    name: 正式部署包 linux/${{ matrix.arch }}
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}

    steps:
      - name: 检出 Release 对应标签
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0

      - name: 安装 Go
        uses: actions/setup-go@v5
        with:
          go-version-file: .go-version
          cache-dependency-path: gofi-backend/go.sum

      - name: 安装 pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: gofi-frontend/package.json

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: gofi-frontend/pnpm-lock.yaml

      - name: 安装依赖
        run: make install

      - name: 构建正式部署包
        run: >-
          make package
          TARGET_OS=linux
          TARGET_ARCH=${{ matrix.arch }}
          VERSION="${{ needs.verify.outputs.version }}"

      - name: 验证正式部署包中的生产二进制
        run: make smoke TARGET_OS=linux TARGET_ARCH=${{ matrix.arch }}

      - name: 暂存正式部署包
        uses: actions/upload-artifact@v7
        with:
          name: release-linux-${{ matrix.arch }}
          path: |
            output/*.tar.gz
            output/*.tar.gz.sha256
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  release-docker:
    name: 正式 Docker linux/${{ matrix.arch }}
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}

    steps:
      - name: 检出 Release 对应标签
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: 登录 Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_ACCESS_TOKEN }}

      - name: 构建原生正式镜像
        env:
          IMAGE: ${{ secrets.DOCKER_USERNAME }}/gofi
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          docker build \
            --build-arg VERSION="$VERSION" \
            --tag "$IMAGE:$VERSION-${{ matrix.arch }}" \
            .

      - name: 验证原生正式镜像
        env:
          IMAGE: ${{ secrets.DOCKER_USERNAME }}/gofi
          VERSION: ${{ needs.verify.outputs.version }}
        run: sh scripts/docker-smoke.sh "$IMAGE:$VERSION-${{ matrix.arch }}" "$VERSION"

      - name: 推送版本架构镜像
        env:
          IMAGE: ${{ secrets.DOCKER_USERNAME }}/gofi
          VERSION: ${{ needs.verify.outputs.version }}
        run: docker push "$IMAGE:$VERSION-${{ matrix.arch }}"

  release-manifest:
    name: 发布多架构 Docker 清单
    needs: [verify, release-docker]
    runs-on: ubuntu-24.04

    steps:
      - name: 登录 Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_ACCESS_TOKEN }}

      - name: 合并并推送版本清单
        env:
          IMAGE: ${{ secrets.DOCKER_USERNAME }}/gofi
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          docker manifest create "$IMAGE:$VERSION" \
            "$IMAGE:$VERSION-amd64" \
            "$IMAGE:$VERSION-arm64"
          docker manifest push "$IMAGE:$VERSION"

      - name: 合并并推送稳定版 latest 清单
        if: ${{ github.event.release.prerelease == false }}
        env:
          IMAGE: ${{ secrets.DOCKER_USERNAME }}/gofi
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          docker manifest create "$IMAGE:latest" \
            "$IMAGE:$VERSION-amd64" \
            "$IMAGE:$VERSION-arm64"
          docker manifest push "$IMAGE:latest"

  attach-assets:
    name: 附加资产到现有 GitHub Release
    needs: [release-packages, release-manifest]
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: 下载全部正式部署包
        uses: actions/download-artifact@v8
        with:
          pattern: release-linux-*
          path: output
          merge-multiple: true

      - name: 确认 Release 已存在并上传资产
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null
          gh release upload "$RELEASE_TAG" output/* --repo "$GITHUB_REPOSITORY" --clobber
