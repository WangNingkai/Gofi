name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: 构建并发布
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: 安装 Go
        uses: actions/setup-go@v5
        with:
          go-version-file: .go-version
          cache-dependency-path: gofi-backend/go.sum

      - name: 安装 pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: gofi-frontend/package.json

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: gofi-frontend/pnpm-lock.yaml

      - name: 安装交叉编译工具链
        run: |
          sudo apt-get update
          sudo apt-get install --yes gcc-aarch64-linux-gnu libc6-dev-arm64-cross

      - name: 安装项目依赖
        run: make install

      - name: 运行完整检查
        run: make check

      - name: 构建 Linux 发布产物
        run: make cross-build VERSION="${{ github.ref_name }}"

      - name: 验证 amd64 生产二进制
        run: make smoke TARGET_OS=linux TARGET_ARCH=amd64 VERSION="${{ github.ref_name }}"

      - name: 创建 GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: output/*

  docker:
    name: 发布 Docker 镜像
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v6

      - name: 配置 QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - name: 配置 Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: 登录 Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_ACCESS_TOKEN }}

      - name: 构建并推送镜像
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/gofi:${{ github.ref_name }}
            ${{ secrets.DOCKER_USERNAME }}/gofi:latest
