name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  verify:
    name: 发布前检查
    runs-on: ubuntu-24.04

    steps:
      - name: 检出代码
        uses: actions/checkout@v6

      - name: 安装 Go
        uses: actions/setup-go@v5
        with:
          go-version-file: .go-version
          cache-dependency-path: gofi-backend/go.sum

      - name: 安装 pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: gofi-frontend/package.json

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: gofi-frontend/pnpm-lock.yaml

      - name: 安装依赖
        run: make install

      - name: 运行完整检查
        run: make check

  binaries:
    name: 发布二进制 ${{ matrix.arch }}
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}

    steps:
      - name: 检出代码
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: 安装 Go
        uses: actions/setup-go@v5
        with:
          go-version-file: .go-version
          cache-dependency-path: gofi-backend/go.sum

      - name: 安装 pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: gofi-frontend/package.json

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: gofi-frontend/pnpm-lock.yaml

      - name: 安装依赖
        run: make install

      - name: 构建当前原生架构
        run: make build TARGET_OS=linux TARGET_ARCH=${{ matrix.arch }} VERSION="${{ github.ref_name }}"

      - name: 验证生产二进制
        run: make smoke TARGET_OS=linux TARGET_ARCH=${{ matrix.arch }}

      - name: 上传构建产物
        uses: actions/upload-artifact@v7
        with:
          name: gofi-linux-${{ matrix.arch }}
          path: output/*
          if-no-files-found: error

  release:
    name: 创建 GitHub Release
    needs: binaries
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: 下载全部构建产物
        uses: actions/download-artifact@v8
        with:
          pattern: gofi-linux-*
          path: output
          merge-multiple: true

      - name: 创建 GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: output/*

  docker:
    name: 发布原生镜像 ${{ matrix.arch }}
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}

    steps:
      - name: 检出代码
        uses: actions/checkout@v6

      - name: 登录 Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_ACCESS_TOKEN }}

      - name: 构建原生镜像
        env:
          IMAGE: ${{ secrets.DOCKER_USERNAME }}/gofi
        run: |
          docker build \
            --build-arg VERSION="${{ github.ref_name }}" \
            --tag "$IMAGE:${{ github.ref_name }}-${{ matrix.arch }}" \
            --tag "$IMAGE:latest-${{ matrix.arch }}" \
            .

      - name: 验证原生镜像
        env:
          IMAGE: ${{ secrets.DOCKER_USERNAME }}/gofi
        run: sh scripts/docker-smoke.sh "$IMAGE:${{ github.ref_name }}-${{ matrix.arch }}"

      - name: 推送架构镜像
        env:
          IMAGE: ${{ secrets.DOCKER_USERNAME }}/gofi
        run: |
          docker push "$IMAGE:${{ github.ref_name }}-${{ matrix.arch }}"
          docker push "$IMAGE:latest-${{ matrix.arch }}"

  manifest:
    name: 发布多架构清单
    needs: docker
    runs-on: ubuntu-24.04

    steps:
      - name: 登录 Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_ACCESS_TOKEN }}

      - name: 合并并推送多架构清单
        env:
          IMAGE: ${{ secrets.DOCKER_USERNAME }}/gofi
          VERSION: ${{ github.ref_name }}
        run: |
          docker manifest create "$IMAGE:$VERSION" \
            "$IMAGE:$VERSION-amd64" \
            "$IMAGE:$VERSION-arm64"
          docker manifest push "$IMAGE:$VERSION"
          docker manifest create "$IMAGE:latest" \
            "$IMAGE:latest-amd64" \
            "$IMAGE:latest-arm64"
          docker manifest push "$IMAGE:latest"
