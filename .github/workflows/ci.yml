name: CI and test packages

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: 完整检查
    runs-on: ubuntu-24.04

    steps:
      - name: 检出代码
        uses: actions/checkout@v6

      - name: 安装 Go
        uses: actions/setup-go@v5
        with:
          go-version-file: .go-version
          cache-dependency-path: gofi-backend/go.sum

      - name: 安装 pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: gofi-frontend/package.json

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: gofi-frontend/pnpm-lock.yaml

      - name: 安装依赖
        run: make install

      - name: 运行完整检查
        run: make check

  test-packages:
    name: 测试部署包 linux/${{ matrix.arch }}
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}

    steps:
      - name: 检出代码
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: 安装 Go
        uses: actions/setup-go@v5
        with:
          go-version-file: .go-version
          cache-dependency-path: gofi-backend/go.sum

      - name: 安装 pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: gofi-frontend/package.json

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: gofi-frontend/pnpm-lock.yaml

      - name: 安装依赖
        run: make install

      - name: 生成测试版本号
        id: version
        shell: bash
        run: echo "value=test-${GITHUB_SHA:0:12}" >> "$GITHUB_OUTPUT"

      - name: 构建可部署测试包
        run: >-
          make package
          TARGET_OS=linux
          TARGET_ARCH=${{ matrix.arch }}
          VERSION="${{ steps.version.outputs.value }}"

      - name: 验证测试包中的生产二进制
        run: make smoke TARGET_OS=linux TARGET_ARCH=${{ matrix.arch }}

      - name: 上传测试部署包
        uses: actions/upload-artifact@v7
        with:
          name: gofi-${{ steps.version.outputs.value }}-linux-${{ matrix.arch }}
          path: |
            output/*.tar.gz
            output/*.tar.gz.sha256
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  docker-smoke:
    name: 测试 Docker linux/${{ matrix.arch }}
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}

    steps:
      - name: 检出代码
        uses: actions/checkout@v6

      - name: 构建原生测试镜像
        shell: bash
        run: |
          test_version="test-${GITHUB_SHA:0:12}"
          docker build --build-arg VERSION="$test_version" --tag "gofi:$test_version-${{ matrix.arch }}" .

      - name: 验证原生测试镜像
        shell: bash
        run: |
          test_version="test-${GITHUB_SHA:0:12}"
          sh scripts/docker-smoke.sh "gofi:$test_version-${{ matrix.arch }}" "$test_version"
