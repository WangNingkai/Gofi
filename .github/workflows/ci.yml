name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: 完整检查
    runs-on: ubuntu-24.04

    steps:
      - name: 检出代码
        uses: actions/checkout@v6

      - name: 安装 Go
        uses: actions/setup-go@v5
        with:
          go-version-file: .go-version
          cache-dependency-path: gofi-backend/go.sum

      - name: 安装 pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: gofi-frontend/package.json

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: gofi-frontend/pnpm-lock.yaml

      - name: 安装依赖
        run: make install

      - name: 运行完整检查
        run: make check

  binaries:
    name: 原生二进制 ${{ matrix.arch }}
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}

    steps:
      - name: 检出代码
        uses: actions/checkout@v6

      - name: 安装 Go
        uses: actions/setup-go@v5
        with:
          go-version-file: .go-version
          cache-dependency-path: gofi-backend/go.sum

      - name: 安装 pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: gofi-frontend/package.json

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: gofi-frontend/pnpm-lock.yaml

      - name: 安装依赖
        run: make install

      - name: 构建当前原生架构
        run: make build TARGET_OS=linux TARGET_ARCH=${{ matrix.arch }} CC=gcc

      - name: 验证生产二进制
        run: make smoke TARGET_OS=linux TARGET_ARCH=${{ matrix.arch }}

      - name: 上传构建产物
        uses: actions/upload-artifact@v7
        with:
          name: gofi-linux-${{ matrix.arch }}
          path: output/*
          if-no-files-found: error
          retention-days: 7

  docker:
    name: 原生 Docker ${{ matrix.arch }}
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}

    steps:
      - name: 检出代码
        uses: actions/checkout@v6

      - name: 构建原生镜像
        run: docker build --tag gofi:ci-${{ matrix.arch }} .

      - name: 验证原生镜像
        run: sh scripts/docker-smoke.sh gofi:ci-${{ matrix.arch }}
